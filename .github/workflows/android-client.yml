name: Android client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
        working-directory: frontend
      - name: Configure production workspace URL
        run: sed -i "s|https://example.com/app|${{ vars.PRODUCT_WEB_URL }}/app|" frontend/src-tauri/tauri.conf.json
      - run: npm run android:init
        working-directory: frontend
      - run: npm run android:build -- --apk --target aarch64
        working-directory: frontend
      - name: Sign installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/research-kms-release.jks"
          unsigned_apk=$(find frontend/src-tauri/gen/android/app/build/outputs -name '*-unsigned.apk' -print -quit)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/research-kms-release.jks" --ks-key-alias researchkms --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_STORE_PASSWORD --out frontend/src-tauri/gen/android/app/build/outputs/Research-KMS-Android-v0.3.0.apk "$unsigned_apk"
          "$apksigner" verify --verbose frontend/src-tauri/gen/android/app/build/outputs/Research-KMS-Android-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: research-kms-android-v0.3.0
          path: frontend/src-tauri/gen/android/app/build/outputs/Research-KMS-Android-v0.3.0.apk
          if-no-files-found: error
