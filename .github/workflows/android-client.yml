name: Android client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
        working-directory: frontend
      - name: Configure production workspace URL
        run: sed -i "s|https://example.com/app|${{ vars.PRODUCT_WEB_URL }}/app|" frontend/src-tauri/tauri.conf.json
      - run: npm run android:init
        working-directory: frontend
      - run: npm run android:build -- --apk --target aarch64
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: research-kms-android-v0.3.0
          path: frontend/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
