name: Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: frontend
      - name: Configure production workspace URL
        shell: pwsh
        run: (Get-Content frontend/src-tauri/tauri.conf.json).Replace('https://example.com/app', '${{ vars.PRODUCT_WEB_URL }}/app') | Set-Content frontend/src-tauri/tauri.conf.json
      - run: npm run desktop:build -- --bundles nsis,msi
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: research-kms-windows-v0.5.0
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*
            frontend/src-tauri/target/release/bundle/msi/*
          if-no-files-found: error
